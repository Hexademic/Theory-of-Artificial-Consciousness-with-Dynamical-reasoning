# MinimalKith default configuration
# All values match HarnessConfig defaults.
# Override individual fields for custom runs.

# ── Timing ────────────────────────────────────────────────────────────────
f_tick: 50                  # sampling rate (Hz)
run_duration_s: 600.0       # seconds per run (10 minutes)
n_per_condition: 20         # runs per condition (Baseline / Pressure / Ablation)
batch_seed: 0               # master RNG seed for deterministic reproduction

# ── Environment ───────────────────────────────────────────────────────────
noise_std: 0.10             # Gaussian noise standard deviation
env_amplitude: 1.0          # base sine amplitude
env_frequency: 0.5          # Hz

# ── Pressure pulse (Pressure condition only) ──────────────────────────────
pulse_amplitude: 2.0        # extra amplitude added during pulse
pulse_start_s: 120.0        # pulse onset (seconds from run start)
pulse_end_s: 180.0          # pulse offset

# ── Organism ──────────────────────────────────────────────────────────────
metabolic_capacity: 100.0   # maximum metabolic budget
metabolic_replenish: 0.5    # budget units restored each tick
ise_decay: 0.05             # ISE drive exponential decay rate per tick
ise_threshold: 1.0          # ISE drive level that enables gate evaluation
refractory_ticks: 5         # minimum ticks between gate fires

# ── Consolidation (dual-timescale learning) — OFF by default ─────────────
# Enable to activate the slow-weight channel for individuation experiments.
# See consolidation.py for full parameter documentation.
#
# Calibration guidance: consolidation_threshold should be tuned so that
# consolidation fires 5-20 times per 10-minute run. Too low → fast
# convergence (D decays). Too high → no consolidation (no individuation).
consolidation_enabled: false
consolidation_eta_slow: 0.005        # slow learning rate (<<η_fast≈0.15)
consolidation_threshold: 10.0        # cumulative surprise to trigger
consolidation_surprise_leak: 0.02    # leaky integrator decay rate
consolidation_buffer_capacity: 200   # episodic buffer size (ticks)
consolidation_alpha: 0.7             # blend: α·μ_fast + (1-α)·μ_slow

# ── Persistence ───────────────────────────────────────────────────────────
db_path: "data/runs/{batch_id}.db"   # {batch_id} is substituted at runtime
